# WEPC / Default-Direct — 人工直连例外
# 默认策略已经是 MATCH,DIRECT；只有域名可能被 GFW 等较低优先级规则误代理时，才需要在这里明确直连。
# 原仓库的人工放行域名原样保留，供迁移期兼容；不再依赖 MetaCubeX 服务白名单。
# 注意：自定义拒绝与自定义代理规则优先级高于本规则。
payload:

  # 中国政府 / 政务
  - "+.gov.cn"

  # 中国军队官方域名
  - "+.mil.cn"

  # 中国铁路 12306 / 货运 95306
  - "+.12306.cn"
  - "+.95306.cn"

  # 华泰证券 / 涨乐财富通
  - "+.zhangle.com"
  - "+.htsc.com"
  - "+.htsc.com.cn"
  - "+.htzq.com.cn"

  # 涨乐可能使用的国内金融内容服务
  - "+.finet.com.cn"
  - "+.roadshowing.com"
